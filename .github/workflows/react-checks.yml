name: React and Python checks
on:
  push:
    branches: [feat/react-experience]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests_next -v
      - run: python scripts/package_react.py
      - uses: actions/upload-artifact@v4
        with:
          name: inquire-react-source
          path: dist/inquire-react-source.zip
